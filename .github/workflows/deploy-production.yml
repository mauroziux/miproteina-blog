name: Build Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
