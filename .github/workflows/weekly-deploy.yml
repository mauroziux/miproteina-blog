name: Weekly Build Verification

on:
  schedule:
    # Every Monday at 12:55 UTC (07:55 Colombia, UTC-5)
    - cron: "55 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
