name: Weekly Blog Deploy

on:
  schedule:
    # Every Monday at 12:55 UTC (07:55 Colombia, UTC-5)
    - cron: "55 12 * * 1"
  workflow_dispatch:

jobs:
  trigger-coolify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy API
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_PRODUCTION_UUID: ${{ secrets.COOLIFY_PRODUCTION_UUID }}
        run: |
          if [ -z "$COOLIFY_API_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_PRODUCTION_UUID" ]; then
            echo "Missing one or more required secrets: COOLIFY_API_URL, COOLIFY_API_TOKEN, COOLIFY_PRODUCTION_UUID"
            exit 1
          fi

          DEPLOY_ENDPOINT="${COOLIFY_API_URL%/}/applications/${COOLIFY_PRODUCTION_UUID}/start"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          echo "Coolify API response: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "::error::Coolify deploy trigger failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "Weekly Coolify deployment triggered successfully"
