name: Weekly Blog Deploy

on:
  schedule:
    # Every Monday at 12:55 UTC (07:55 Colombia, UTC-5)
    - cron: "55 12 * * 1"
  workflow_dispatch:

jobs:
  trigger-coolify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy API
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
        run: |
          if [ -z "$COOLIFY_API_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APPLICATION_UUID" ]; then
            echo "Missing one or more required secrets: COOLIFY_API_URL, COOLIFY_API_TOKEN, COOLIFY_APPLICATION_UUID"
            exit 1
          fi

          DEPLOY_ENDPOINT="${COOLIFY_API_URL%/}/api/v1/deploy"

          curl --fail --show-error --silent \
            -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"$COOLIFY_APPLICATION_UUID\"}"

          echo "Coolify deployment request sent successfully"
