<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Errores de principiantes en el gimnasio</title>
  <desc id="desc">Infografia con cinco errores comunes al empezar en el gym y enfoque de correccion.</desc>
  <rect width="1200" height="630" fill="#1f2937"/>
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="#111827" stroke="#f59e0b"/>
  <text x="90" y="120" fill="#f59e0b" font-size="42" font-family="Arial, sans-serif" font-weight="700">5 errores al empezar en el gimnasio</text>
  <text x="90" y="180" fill="#fde68a" font-size="26" font-family="Arial, sans-serif">Evitalos para progresar mas rapido</text>
  <text x="90" y="245" fill="#f9fafb" font-size="24" font-family="Arial, sans-serif">1. Entrenar sin plan</text>
  <text x="90" y="285" fill="#f9fafb" font-size="24" font-family="Arial, sans-serif">2. Priorizar peso sobre tecnica</text>
  <text x="90" y="325" fill="#f9fafb" font-size="24" font-family="Arial, sans-serif">3. Dormir poco</text>
  <text x="90" y="365" fill="#f9fafb" font-size="24" font-family="Arial, sans-serif">4. Comer a ojo</text>
  <text x="90" y="405" fill="#f9fafb" font-size="24" font-family="Arial, sans-serif">5. Cambiar estrategia cada semana</text>
  <text x="90" y="485" fill="#86efac" font-size="24" font-family="Arial, sans-serif">Solucion: consistencia + registro + ajustes cada 3-4 semanas</text>
</svg>
