<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Guia de hidratacion si entrenas</title>
  <desc id="desc">Infografia con formula diaria de agua por peso corporal y protocolo antes, durante y despues de entrenar.</desc>
  <rect width="1200" height="630" fill="#082f49"/>
  <rect x="45" y="45" width="1110" height="540" rx="24" fill="#0c4a6e" stroke="#67e8f9"/>
  <text x="85" y="120" fill="#67e8f9" font-size="42" font-family="Arial, sans-serif" font-weight="700">Cuanta agua tomar si entrenas</text>
  <text x="85" y="180" fill="#e0f2fe" font-size="30" font-family="Arial, sans-serif" font-weight="700">30-40 ml por kg al dia</text>
  <text x="85" y="250" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">Antes: 400-600 ml</text>
  <text x="85" y="295" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">Durante: sorbos frecuentes</text>
  <text x="85" y="340" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">Despues: reponer segun sudoracion</text>
  <text x="85" y="420" fill="#bae6fd" font-size="24" font-family="Arial, sans-serif">En calor intenso: considera electrolitos</text>
  <text x="85" y="500" fill="#f8fafc" font-size="22" font-family="Arial, sans-serif">Mi Proteina Blog • Hidratacion = mejor rendimiento</text>
</svg>
