<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Creatina con carga o sin carga</title>
  <desc id="desc">Comparacion visual entre fase de carga y estrategia sin carga en creatina.</desc>
  <rect width="1200" height="630" fill="#081124"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#0f1d3a" stroke="#38bdf8"/>
  <text x="80" y="120" fill="#38bdf8" font-size="44" font-family="Arial, sans-serif" font-weight="700">Fase de carga de creatina: ¿si o no?</text>
  <text x="80" y="180" fill="#dbeafe" font-size="26" font-family="Arial, sans-serif">Ambas funcionan. Cambia la velocidad de saturacion.</text>
  <text x="80" y="260" fill="#a7f3d0" font-size="28" font-family="Arial, sans-serif" font-weight="700">Con carga</text>
  <text x="80" y="300" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">20 g/dia (4 tomas) por 5-7 dias</text>
  <text x="80" y="350" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">Luego 3-5 g/dia de mantenimiento</text>
  <text x="620" y="260" fill="#fcd34d" font-size="28" font-family="Arial, sans-serif" font-weight="700">Sin carga</text>
  <text x="620" y="300" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">3-5 g/dia desde el dia 1</text>
  <text x="620" y="350" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">Mismo resultado final, mas simple</text>
  <text x="80" y="500" fill="#e2e8f0" font-size="22" font-family="Arial, sans-serif">Mi Proteina Blog • Elige la estrategia que puedas sostener</text>
</svg>
