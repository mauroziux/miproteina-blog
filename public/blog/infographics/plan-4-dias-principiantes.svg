<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Plan basico de 4 dias para principiantes</title>
  <desc id="desc">Distribucion semanal de entrenamiento para principiantes con fuerza y recuperacion.</desc>
  <rect width="1200" height="630" fill="#111827"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#1f2937" stroke="#10b981"/>
  <text x="80" y="120" fill="#10b981" font-size="42" font-family="Arial, sans-serif" font-weight="700">Plan 4 dias para principiantes</text>
  <text x="80" y="180" fill="#d1fae5" font-size="26" font-family="Arial, sans-serif">Semana tipo para crear habito y progresar</text>
  <text x="80" y="250" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">Lun: Tren superior</text>
  <text x="80" y="295" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">Mar: Tren inferior</text>
  <text x="80" y="340" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">Jue: Tren superior</text>
  <text x="80" y="385" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">Vie: Tren inferior</text>
  <text x="80" y="460" fill="#86efac" font-size="24" font-family="Arial, sans-serif">Clave: tecnica + registro + progresion gradual</text>
</svg>
