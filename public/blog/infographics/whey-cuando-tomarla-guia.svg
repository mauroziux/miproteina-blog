<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Whey protein: cuando tomarla</title>
  <desc id="desc">Infografia de horarios recomendados para tomar whey protein segun objetivo.</desc>
  <rect width="1200" height="630" fill="#0b1022"/>
  <rect x="55" y="55" width="1090" height="520" rx="22" fill="#131a32" stroke="#818cf8"/>
  <text x="90" y="130" fill="#818cf8" font-size="42" font-family="Arial, sans-serif" font-weight="700">Proteina whey: mejores momentos</text>
  <text x="90" y="180" fill="#e5e7eb" font-size="28" font-family="Arial, sans-serif">Objetivo: completar tu meta diaria de proteina</text>
  <text x="90" y="250" fill="#c4b5fd" font-size="28" font-family="Arial, sans-serif">1) Postentreno → recuperacion rapida</text>
  <text x="90" y="300" fill="#c4b5fd" font-size="28" font-family="Arial, sans-serif">2) Desayuno rapido → mas saciedad</text>
  <text x="90" y="350" fill="#c4b5fd" font-size="28" font-family="Arial, sans-serif">3) Media tarde → menos antojos</text>
  <text x="90" y="430" fill="#86efac" font-size="30" font-family="Arial, sans-serif" font-weight="700">Referencia diaria: 1.6 a 2.2 g/kg</text>
  <text x="90" y="505" fill="#f8fafc" font-size="22" font-family="Arial, sans-serif">Mi Proteina Blog • Nutricion practica para gente real</text>
</svg>
