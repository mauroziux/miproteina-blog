<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Como elegir proteina segun tu objetivo</title>
  <desc id="desc">Arbol de decision para escoger whey concentrada, whey aislada o proteina vegana.</desc>
  <rect width="1200" height="630" fill="#172554"/>
  <rect x="45" y="45" width="1110" height="540" rx="24" fill="#1e3a8a" stroke="#a5b4fc"/>
  <text x="85" y="120" fill="#c7d2fe" font-size="42" font-family="Arial, sans-serif" font-weight="700">Elige tu proteina en 3 pasos</text>
  <text x="85" y="185" fill="#eef2ff" font-size="24" font-family="Arial, sans-serif">1) Objetivo  2) Digestion  3) Presupuesto</text>
  <text x="85" y="265" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">• Practicidad y costo-beneficio → Whey concentrada</text>
  <text x="85" y="315" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">• Sensibilidad digestiva/lactosa → Whey aislada</text>
  <text x="85" y="365" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">• Sin lacteos o vegano → Proteina vegana</text>
  <text x="85" y="445" fill="#86efac" font-size="24" font-family="Arial, sans-serif">Meta diaria: 1.6 a 2.2 g/kg de proteina total</text>
  <text x="85" y="510" fill="#f8fafc" font-size="22" font-family="Arial, sans-serif">Mi Proteina Blog • La mejor proteina es la que sostienes</text>
</svg>
