<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Snacks altos en proteina para la tarde</title>
  <desc id="desc">Infografia con tres snacks de tarde y gramos aproximados de proteina.</desc>
  <rect width="1200" height="630" fill="#10231a"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#153126" stroke="#34d399"/>
  <text x="80" y="120" fill="#34d399" font-size="42" font-family="Arial, sans-serif" font-weight="700">3 snacks altos en proteina</text>
  <text x="80" y="170" fill="#d1fae5" font-size="27" font-family="Arial, sans-serif">Para controlar hambre y llegar mejor a la cena</text>
  <text x="80" y="250" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">• Yogur griego + fruta + semillas → 18-25 g</text>
  <text x="80" y="300" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">• Arepa delgada + pechuga → 22-30 g</text>
  <text x="80" y="350" fill="#ffffff" font-size="26" font-family="Arial, sans-serif">• Batido whey rapido → 20-27 g</text>
  <text x="80" y="430" fill="#a7f3d0" font-size="24" font-family="Arial, sans-serif">Tip: deja 2 opciones listas desde la noche anterior.</text>
  <text x="80" y="505" fill="#ecfeff" font-size="22" font-family="Arial, sans-serif">Mi Proteina Blog • Menos improvisacion, mas resultados</text>
</svg>
